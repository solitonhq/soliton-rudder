name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Please check the [troubleshooting guide](../tree/main/docs/TROUBLESHOOTING.md) first.
        **Remove secrets, tokens and private hostnames** from anything you paste.
  - type: input
    id: version
    attributes:
      label: Soliton Rudder version
      description: Settings → About
    validations: { required: true }
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.1, Apple M2
    validations: { required: true }
  - type: input
    id: cluster
    attributes:
      label: Cluster type and Kubernetes version
      placeholder: EKS 1.31 / kind 1.34 / on-prem …
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what you saw (error text, screenshot).
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Extra details
      description: Relevant plugin logs, whether it works in kubectl, etc.
